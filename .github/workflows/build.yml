name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    uses: homebridge/.github/.github/workflows/eslint.yml@latest

  # Runs `npm run build --if-present` and `npm run test`, on Node 22, 24 and 26.
  # The `--if-present` is what keeps this usable for the JavaScript plugins,
  # which have no build script - they run the tests only.
  #
  # `check_changelog` is deliberately left off here, unlike the other plugins in
  # the org. This changelog is still in the standard-version format, there is no
  # `changelog:sync` script, and there are unreleased commits with no pending
  # section - so turning it on would fail every build until the changelog is
  # converted.
  build-and-test:
    uses: homebridge/.github/.github/workflows/nodejs-build-and-test.yml@latest
